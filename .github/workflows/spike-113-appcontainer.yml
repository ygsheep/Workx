name: spike-113-appcontainer

# Issue #113 的 AppContainer 可行性 spike —— 在干净的 GitHub Windows runner 上
# 复测本机（开发机）"AC 进程初始化即死" 的现象是否为环境因素。
# 结论回填 issue #113；评估结束后本 workflow 可删除。

on:
  workflow_dispatch:

jobs:
  spike:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1

      - name: Build spike
        shell: cmd
        run: |
          cl /nologo /utf-8 /EHsc /W3 scripts\spikes\ac_probe.cpp /Fe:ac_probe.exe
          cl /nologo /utf-8 /EHsc /W3 scripts\spikes\appcontainer_spike.cpp /Fe:ac_spike.exe

      - name: Run spike
        shell: cmd
        run: ac_spike.exe

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: spike-result
          path: spike-result.txt
          if-no-files-found: warn
