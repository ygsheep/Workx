name: Release

# 注意: 不能给 on 加引号（GitHub 不接受 'on' 形式），此处用原生 on
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  build:
    name: Build & package (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
            shell: pwsh
            bootstrap: .\vcpkg\bootstrap-vcpkg.bat
            install: .\vcpkg\vcpkg.exe install --triplet x64-windows
            build_dir: build/bin/Release
          - os: ubuntu-latest
            platform: linux
            shell: bash
            bootstrap: ./vcpkg/bootstrap-vcpkg.sh
            install: ./vcpkg/vcpkg install --triplet x64-linux
            build_dir: build/bin
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Clone & bootstrap vcpkg
        run: |
          git clone https://github.com/microsoft/vcpkg.git vcpkg
          ${{ matrix.bootstrap }}

      - name: Install vcpkg deps
        run: ${{ matrix.install }}

      - name: Fetch ripgrep (vendor)
        run: python scripts/fetch-ripgrep.py

      - name: Configure & build
        run: |
          cmake -B build -S ${{ github.workspace }} -DCMAKE_TOOLCHAIN_FILE=${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake -DCMAKE_BUILD_TYPE=Release -DWORKX_BUILD_TESTS=OFF
          cmake --build build --config Release --target workx -j 2

      - name: Package release archive
        run: python scripts/package_release.py --platform ${{ matrix.platform }} --arch amd64 --build-dir "${{ github.workspace }}/${{ matrix.build_dir }}"

      - name: Download WiX v3.14 (Windows MSI toolchain)
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $wix = Join-Path "${{ github.workspace }}" "wix314"
          New-Item -ItemType Directory -Path $wix -Force | Out-Null
          Invoke-WebRequest -Uri "https://github.com/wixtoolset/wix3/releases/download/wix3141rtm/wix314-binaries.zip" -OutFile "$wix\wix.zip"
          Expand-Archive -Path "$wix\wix.zip" -DestinationPath "$wix\bin" -Force
          Remove-Item "$wix\wix.zip"
          "WIX_BIN=$wix\bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build MSI installer
        if: matrix.platform == 'windows'
        shell: pwsh
        run: |
          $msi = Join-Path "${{ github.workspace }}" "dist"
          & ".\scripts\build-msi.ps1" `
            -BuildDir "${{ github.workspace }}\${{ matrix.build_dir }}" `
            -OutDir $msi `
            -WixBin $env:WIX_BIN
          Get-ChildItem $msi -Filter *.msi | ForEach-Object { "MSI artifact: $($_.Name) ($([math]::Round($_.Length/1MB,1)) MB)" }

      - name: Upload dist as workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist-${{ matrix.platform }}
          path: dist/*
          if-no-files-found: error

  # 唯一发布 owner：两个 matrix job 若各自调用 action-gh-release，会并发抢建/改写同一个
  # Release，后到者 Finalizing release 撞 HttpError 并耗尽重试，使整个 run 判红（#180）。
  # 故各平台只上传 artifact，由本 job 汇总后发布一次。
  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download all platform artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: List collected artifacts
        run: ls -lh dist

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true